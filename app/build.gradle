plugins { id 'com.android.application' }
// External configuration is optional for emulator builds; never commit it.
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
    namespace 'cl.aik1a.comunidadconectada'
    compileSdk 35
    defaultConfig {
        applicationId 'cl.aik1a.comunidadconectada'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    flavorDimensions 'backend'
    productFlavors {
        emulator { dimension 'backend'; buildConfigField 'boolean', 'USE_EMULATORS', 'true' }
        production { dimension 'backend'; buildConfigField 'boolean', 'USE_EMULATORS', 'false' }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
